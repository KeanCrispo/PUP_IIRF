<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Initialize Supabase
  const supabaseUrl = 'https://npyyaoddrquxwvkliupl.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5weXlhb2RkcnF1eHd2a2xpdXBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDk2OTQyOTYsImV4cCI6MjA2NTI3MDI5Nn0.aBXknpBk6wq0YgFjVYfSZm2GqUacieZNq8-rny__Et0';
  const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

  document.querySelector('.iirf-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData.entries());

    // Collect all checked incomes
    data.income = Array.from(document.querySelectorAll('input[name="income"]:checked')).map(cb => cb.value).join(', ');

    // Collect all checked residences
    data.residence = Array.from(document.querySelectorAll('input[name="residence"]:checked')).map(cb => cb.value).join(', ');

    const email = data.email;
    const courseYearSection = data.course_year_section;
    if (!email || !courseYearSection) {
      alert('Email and Course, Year and Section are required.');
      return;
    }

    // Check for a record with BOTH email and course_year_section
    const { data: existing, error: selectError } = await supabase
      .from('iirf_forms')
      .select('*')
      .eq('email', email)
      .eq('course_year_section', courseYearSection)
      .single();

    if (selectError && selectError.code !== 'PGRST116') {
      alert('Error checking record: ' + selectError.message);
      return;
    }

    // List of fields to copy if adding a new record
    const fieldsToCopy = [
      'pre_elementary_school', 'pre_elementary_address', 'pre_elementary_type', 'pre_elementary_dates', 'pre_elementary_honors',
      'elementary_school', 'elementary_address', 'elementary_type', 'elementary_dates', 'elementary_honors',
      'high_school', 'high_school_address', 'high_school_type', 'high_school_dates', 'high_school_honors',
      'vocational_school', 'vocational_address', 'vocational_type', 'vocational_dates', 'vocational_honors',
      'college_school', 'college_address', 'college_type', 'college_dates', 'college_honors',
      'nature_of_schooling', 'if_interrupted_why',
      'father_name', 'father_age', 'father_living', 'father_educational_attainment', 'father_occupation', 'father_employer', 'father_employer_address',
      'mother_name', 'mother_age', 'mother_living', 'mother_educational_attainment', 'mother_occupation', 'mother_employer', 'mother_employer_address',
      'guardian_name', 'guardian_age', 'guardian_relation', 'guardian_educational_attainment', 'guardian_occupation', 'guardian_employer', 'guardian_employer_address',
      'parents_marital_relationship', 'number_of_children', 'number_of_brothers', 'number_of_sisters', 'number_of_siblings_employed',
      'ordinal_position', 'sibling_support', 'who_finances_schooling', 'parents_total_monthly_income', 'other_income',
      'quiet_place_to_study', 'share_room', 'share_room_with', 'nature_of_residence'
    ];

    if (existing && existing.id) {
      // Update the existing record
      const { error: updateError } = await supabase
        .from('iirf_forms')
        .update(data)
        .eq('id', existing.id);
      if (updateError) {
        alert('Error updating form: ' + updateError.message);
      } else {
        alert('Form updated successfully!');
      }
    } else {
      // Try to find an existing record to copy details from (by email only)
      const { data: prev, error: prevError } = await supabase
        .from('iirf_forms')
        .select('*')
        .eq('email', email)
        .order('id', { ascending: false })
        .limit(1)
        .maybeSingle();

      if (prev && !prevError) {
        // Copy the specified fields from previous record
        fieldsToCopy.forEach(field => {
          if (prev[field] !== undefined && prev[field] !== null && prev[field] !== '') {
            data[field] = prev[field];
          }
        });
      }

      // Insert as new record
      const { error: insertError } = await supabase.from('iirf_forms').insert([data]);
      if (insertError) {
        alert('Error saving form: ' + insertError.message);
      } else {
        alert('New record added successfully!');
        e.target.reset();
      }
    }
  });
</script>
<script>
const canvas = document.getElementById('signature-pad');
const ctx = canvas.getContext('2d');
let drawing = false;

canvas.addEventListener('mousedown', e => {
  drawing = true;
  ctx.beginPath();
  ctx.moveTo(e.offsetX, e.offsetY);
});
canvas.addEventListener('mousemove', e => {
  if (drawing) {
    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();
  }
});
canvas.addEventListener('mouseup', () => drawing = false);
canvas.addEventListener('mouseleave', () => drawing = false);

document.getElementById('clear-signature').onclick = function() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  document.getElementById('signature-data').value = '';
};

// Save signature as data URL on submit
document.querySelector('.iirf-form').addEventListener('submit', function(e) {
  const sigData = canvas.toDataURL();
  document.getElementById('signature-data').value = sigData;
});

// Touch support for mobile devices
canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];
  drawing = true;
  ctx.beginPath();
  ctx.moveTo(touch.clientX - rect.left, touch.clientY - rect.top);
});
canvas.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (drawing) {
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];
    ctx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
    ctx.stroke();
  }
});
canvas.addEventListener('touchend', function(e) {
  e.preventDefault();
  drawing = false;
});
canvas.addEventListener('touchcancel', function(e) {
  e.preventDefault();
  drawing = false;
});
</script>
